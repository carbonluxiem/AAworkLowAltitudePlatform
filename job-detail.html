<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岗位详情 - 低空经济人才平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" role="navigation" aria-label="主导航">
    <div class="logo" onclick="location.href='index.html'">低空经济人才平台</div>
    <div class="nav-links">
        <a href="index.html">首页</a>
        <a href="test.html">能力测评</a>
        <a href="learning.html">学习推荐</a>
        <a href="jobs.html" class="active">岗位信息</a>
        <a href="login.html">登录</a>
    </div>
</nav>

<main class="container">
    <div id="jobDetail" class="card">
        <h2 class="title">岗位详情</h2>
        <div id="loading">加载中...</div>
        <div id="error" style="display:none; color:red;">岗位信息加载失败</div>
        <div id="content" style="display:none;">
            <h3 id="jobName"></h3>
            <p id="jobDesc" class="job-desc"></p>
            <div class="job-meta">
                <span class="meta-item"><strong>类别：</strong><span id="jobCategory"></span></span>
                <span class="meta-item"><strong>要求等级：</strong><span id="jobRequire"></span></span>
                <span class="meta-item"><strong>薪资范围：</strong><span id="jobSalary"></span></span>
                <span class="meta-item"><strong>工作地点：</strong><span id="jobLocation"></span></span>
                <span class="meta-item"><strong>企业类型：</strong><span id="jobCompany"></span></span>
            </div>
            <div class="job-section">
                <h4>主要职责</h4>
                <ul id="responsibilities"></ul>
            </div>
            <div class="job-section">
                <h4>任职要求</h4>
                <ul id="requirements"></ul>
            </div>
        </div>
    </div>
    <div class="action-bar">
        <button class="btn btn-outline" onclick="history.back()">返回岗位列表</button>
        <button class="btn" onclick="location.href='test.html'">重新测评</button>
    </div>
</main>

<script>
window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const jobId = urlParams.get('jobId');
    if (!jobId) {
        showError('缺少岗位ID');
        return;
    }
    loadJobDetail(jobId);
};

async function loadJobDetail(jobId) {
    try {
        const response = await fetch('/api/jobs/' + encodeURIComponent(jobId));
        if (!response.ok) {
            throw new Error('岗位不存在');
        }
        const job = await response.json();
        renderJobDetail(job);
    } catch (error) {
        showError('加载岗位详情失败：' + error.message);
    }
}

function renderJobDetail(job) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    document.getElementById('jobName').textContent = job.name;
    document.getElementById('jobDesc').textContent = job.description;
    document.getElementById('jobCategory').textContent = job.category;
    document.getElementById('jobRequire').textContent = job.requireLevel;
    document.getElementById('jobSalary').textContent = job.salaryRange;
    document.getElementById('jobLocation').textContent = job.workLocation;
    document.getElementById('jobCompany').textContent = job.companyType;

    const respList = document.getElementById('responsibilities');
    respList.innerHTML = '';
    job.responsibilities.forEach(resp => {
        const li = document.createElement('li');
        li.textContent = resp;
        respList.appendChild(li);
    });

    const reqList = document.getElementById('requirements');
    reqList.innerHTML = '';
    job.requirements.forEach(req => {
        const li = document.createElement('li');
        li.textContent = req;
        reqList.appendChild(li);
    });
}

function showError(message) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('error').textContent = message;
}
</script>
</body>
</html>
