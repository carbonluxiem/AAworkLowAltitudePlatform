<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 - 低空经济人才平台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar" role="navigation" aria-label="主导航">
  <div class="logo" onclick="location.href='index.html'">低空经济人才平台</div>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="test.html">能力测评</a>
    <a href="learning.html">学习推荐</a>
    <a href="jobs.html">岗位信息</a>
    <a href="profile.html" class="active">我的</a>
  </div>
</nav>

<main class="container">

  <!-- 用户横幅 -->
  <div class="profile-banner">
    <div class="banner-left">
      <div class="avatar-circle">👤</div>
      <div class="banner-info">
        <h1 class="banner-name" id="profileName">游客</h1>
        <p class="banner-subtitle">低空经济人才平台用户</p>
        <div class="banner-meta" id="profileMeta">尚未完成测评</div>
      </div>
    </div>
    <div class="banner-right">
      <div class="level-badge" id="profileBadge" style="display:none">
        <span class="level-title" id="profileLevelTitle">—</span>
        <span class="level-desc" id="profileLevelDesc">—</span>
      </div>
    </div>
  </div>

  <!-- 双栏 -->
  <div class="profile-row">

    <!-- 左栏：账号信息 + 快捷操作 -->
    <div class="profile-col-left">

      <div class="card">
        <h3 class="section-title">账号信息</h3>
        <div class="info-list">
          <div class="info-row">
            <span class="info-key">用户名</span>
            <span class="info-val" id="infoUsername">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">姓名/昵称</span>
            <span class="info-val" id="infoNickname">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">学校</span>
            <span class="info-val" id="infoSchool">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">专业</span>
            <span class="info-val" id="infoMajor">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">年级</span>
            <span class="info-val" id="infoGrade">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">兴趣方向</span>
            <span class="info-val" id="infoInterest">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">求职方向</span>
            <span class="info-val" id="infoJob">—</span>
          </div>
          <div class="info-row">
            <span class="info-key">测评得分</span>
            <span class="info-val" id="infoScore">尚未测评</span>
          </div>
          <div class="info-row">
            <span class="info-key">人才等级</span>
            <span class="info-val" id="infoLevel">—</span>
          </div>
        </div>
      </div>

  <!-- 快捷操作按钮组：flex 纵向排列 -->
      <div class="card">
        <h3 class="section-title">快捷操作</h3>
        <div style="display:flex;flex-direction:column;gap:var(--space-5);margin-top:var(--space-2)">
          <button class="btn" onclick="location.href='test.html'">去做测评</button>
          <button class="btn" onclick="location.href='result.html'">查看画像报告</button>
          <button class="btn" onclick="location.href='learning.html'">我的学习推荐</button>
          <button class="btn btn-outline" onclick="logout()" style="margin-top:var(--space-3)">退出登录</button>
        </div>
      </div>

    </div>

    <!-- 右栏：修改账号信息 -->
    <div class="profile-col-right">

      <div class="card">
        <h3 class="section-title">修改信息</h3>
        <p style="font-size:0.8125rem;color:var(--palette-text-secondary);margin-bottom:var(--space-7)">留空的字段将保持不变</p>

        <div class="form-group">
          <label class="form-label">新用户名</label>
          <input class="form-input" type="text" id="newUsername" placeholder="输入新用户名">
        </div>

        <div class="form-group">
          <label class="form-label">姓名/昵称</label>
          <input class="form-input" type="text" id="newNickname" placeholder="输入姓名或昵称">
        </div>

        <div class="form-group">
          <label class="form-label">学校</label>
          <input class="form-input" type="text" id="newSchool" placeholder="输入学校名称">
        </div>

        <div class="form-group">
          <label class="form-label">专业</label>
          <input class="form-input" type="text" id="newMajor" placeholder="输入所学专业">
        </div>

        <div class="form-group">
          <label class="form-label">年级</label>
          <input class="form-input" type="text" id="newGrade" placeholder="如：大三、研一">
        </div>

        <div class="form-group">
          <label class="form-label">兴趣方向</label>
          <input class="form-input" type="text" id="newInterest" placeholder="如：无人机、低空物流">
        </div>

        <div class="form-group">
          <label class="form-label">求职方向</label>
          <input class="form-input" type="text" id="newJob" placeholder="如：无人机工程师、飞手">
        </div>

        <div class="form-group">
          <label class="form-label">新密码</label>
          <input class="form-input" type="password" id="newPassword" placeholder="输入新密码">
        </div>

        <div class="form-group">
          <label class="form-label">确认新密码</label>
          <input class="form-input" type="password" id="newPassword2" placeholder="再次输入新密码">
        </div>

        <p id="profileTip" class="form-tip"></p>
        <button class="btn" onclick="saveProfile()">保存修改</button>
      </div>

    </div>

  </div>

</main>

<script>
function getLevel(score) {
    if (score >= 8) return { title: "高潜力人才", desc: "技术能力突出，具备快速成长潜力", type: "gold" };
    if (score >= 5) return { title: "发展型人才", desc: "基础较好，持续学习可实现突破", type: "silver" };
    return { title: "基础型人才", desc: "初入行业，建议系统培养提升", type: "bronze" };
}

window.onload = async function () {
    var isLogin  = localStorage.getItem("isLogin");
    var userId   = localStorage.getItem("userId");
    var username = localStorage.getItem("username");

    if (!isLogin || !userId) {
        document.getElementById("profileName").textContent = "游客";
        document.getElementById("infoUsername").textContent = "未登录";
        return;
    }

    // 先用本地缓存填充，再用后端数据覆盖
    document.getElementById("profileName").textContent = username || "用户";
    document.getElementById("infoUsername").textContent = username || "—";
    document.getElementById("infoNickname").textContent = localStorage.getItem("nickname") || "—";
    document.getElementById("infoSchool").textContent   = localStorage.getItem("school")   || "—";
    document.getElementById("infoMajor").textContent    = localStorage.getItem("major")    || "—";
    document.getElementById("infoGrade").textContent    = localStorage.getItem("grade")    || "—";
    document.getElementById("infoInterest").textContent = localStorage.getItem("interest") || "—";
    document.getElementById("infoJob").textContent      = localStorage.getItem("jobTarget")|| "—";

    try {
        var res = await fetch('http://localhost:8080/api/profile/' + userId);
        if (!res.ok) throw new Error("请求失败");
        var data = await res.json();

        document.getElementById("profileName").textContent = data.username || username;
        document.getElementById("infoUsername").textContent = data.username || username;

        if (data.score !== undefined && data.score !== null) {
            var lv = getLevel(data.score);
            document.getElementById("profileMeta").innerHTML =
                '测评得分：<strong>' + data.score + '</strong> / 10 &nbsp;·&nbsp; 等级：<strong>' + data.level + '</strong>';
            document.getElementById("infoScore").textContent = data.score + " / 10";
            document.getElementById("infoLevel").textContent = data.level || lv.title;

            var badge = document.getElementById("profileBadge");
            badge.style.display = "block";
            badge.className = "level-badge level-" + lv.type;
            document.getElementById("profileLevelTitle").textContent = data.level || lv.title;
            document.getElementById("profileLevelDesc").textContent  = lv.desc;

            // 同步到 localStorage 供其他页面使用
            localStorage.setItem("score", data.score);
        }
    } catch (e) {
        console.warn("获取个人信息失败，使用本地缓存", e);
        var score = localStorage.getItem("score");
        if (score) {
            var lv = getLevel(parseInt(score));
            document.getElementById("profileMeta").innerHTML =
                '测评得分：<strong>' + score + '</strong> / 10 &nbsp;·&nbsp; 等级：<strong>' + lv.title + '</strong>';
            document.getElementById("infoScore").textContent = score + " / 10";
            document.getElementById("infoLevel").textContent = lv.title;
            var badge = document.getElementById("profileBadge");
            badge.style.display = "block";
            badge.className = "level-badge level-" + lv.type;
            document.getElementById("profileLevelTitle").textContent = lv.title;
            document.getElementById("profileLevelDesc").textContent  = lv.desc;
        }
    }
};

function saveProfile() {
    var newUser     = document.getElementById("newUsername").value.trim();
    var newNickname = document.getElementById("newNickname").value.trim();
    var newSchool   = document.getElementById("newSchool").value.trim();
    var newMajor    = document.getElementById("newMajor").value.trim();
    var newGrade    = document.getElementById("newGrade").value.trim();
    var newInterest = document.getElementById("newInterest").value.trim();
    var newJob      = document.getElementById("newJob").value.trim();
    var newPass     = document.getElementById("newPassword").value;
    var newPass2    = document.getElementById("newPassword2").value;
    var tip = document.getElementById("profileTip");

    if (newPass && newPass !== newPass2) {
        tip.textContent = "两次密码输入不一致";
        tip.className = "form-tip";
        return;
    }

    if (newUser)     { localStorage.setItem("username", newUser);       document.getElementById("profileName").textContent = newUser; document.getElementById("infoUsername").textContent = newUser; }
    if (newNickname) { localStorage.setItem("nickname", newNickname);   document.getElementById("infoNickname").textContent = newNickname; }
    if (newSchool)   { localStorage.setItem("school", newSchool);       document.getElementById("infoSchool").textContent = newSchool; }
    if (newMajor)    { localStorage.setItem("major", newMajor);         document.getElementById("infoMajor").textContent = newMajor; }
    if (newGrade)    { localStorage.setItem("grade", newGrade);         document.getElementById("infoGrade").textContent = newGrade; }
    if (newInterest) { localStorage.setItem("interest", newInterest);   document.getElementById("infoInterest").textContent = newInterest; }
    if (newJob)      { localStorage.setItem("jobTarget", newJob);       document.getElementById("infoJob").textContent = newJob; }
    if (newPass)     { localStorage.setItem("password", newPass); }

    tip.textContent = "修改已保存 ✓";
    tip.className = "form-tip ok";
    ["newUsername","newNickname","newSchool","newMajor","newGrade","newInterest","newJob","newPassword","newPassword2"].forEach(function(id) {
        document.getElementById(id).value = "";
    });
}

function logout() {
    localStorage.removeItem("username");
    localStorage.removeItem("password");
    window.location.href = "login.html";
}
</script>

</body>
</html>
